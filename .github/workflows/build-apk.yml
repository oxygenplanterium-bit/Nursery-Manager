name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build:web
      - run: npx cap add android
      - run: pip install pillow && python3 scripts/make-icons.py
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NurseryDailyManager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NurseryDailyManager-apk
          path: NurseryDailyManager.apk
      - name: Publish release (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest NurseryDailyManager.apk --title "Nursery Daily Manager (latest)" --notes "Install this APK on your Android phone."
